<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>Accesso · Monitoraggio Certificati Sanità</title>
<style>
:root{--navy:#14284b;--navy2:#1d3a6b;--acc:#1d4ed8;--card:#fff;--tx:#18222f;--mut:#5f6b7d;--bd:#d5dce8;--err:#b42318;--errbg:#fdecea}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);
  background:radial-gradient(1100px 600px at 15% -10%,#2b4f8f 0%,transparent 60%),linear-gradient(145deg,var(--navy) 0%,#0d1b34 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:32px 30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.logo{display:block;margin:0 auto 18px;width:128px;height:auto}
h1{margin:0;text-align:center;font-size:20px;font-weight:650;color:var(--navy)}
.sub{text-align:center;color:var(--mut);font-size:13.5px;margin:4px 0 22px}
label{display:block;font-size:13px;font-weight:600;color:#3b475a;margin:14px 0 6px}
.f{position:relative}
input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(29,78,216,.18)}
.f input[type=password],.f input.vis{padding-right:78px}
.tg{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--acc);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px}
.tg:hover{background:#eef3ff}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.err{display:none;margin-top:16px;background:var(--errbg);color:var(--err);border-radius:9px;padding:10px 12px;font-size:13.5px}
.err.on{display:block}
button.go{width:100%;margin-top:20px;font:inherit;font-weight:650;font-size:15px;padding:12px;border:0;border-radius:10px;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));cursor:pointer;box-shadow:0 2px 6px rgba(20,40,75,.35);transition:filter .15s}
button.go:hover{filter:brightness(1.15)}
button.go:disabled{opacity:.6;cursor:default}
.foot{margin-top:18px;text-align:center;color:#9fb0cc;font-size:12.5px}
.lock{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/logo.jpg" alt="InnovaPuglia spa">
  <h1>Monitoraggio Certificati Sanità</h1>
  <p class="sub">Accedi con le tue credenziali aziendali</p>
  <form id="f" novalidate autocomplete="on">
    <label for="email">Email aziendale</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nome.cognome@innova.puglia.it" required autofocus>
    <label for="pw">Password</label>
    <div class="f">
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Inserisci la password" required>
      <button type="button" class="tg" id="tg" aria-label="Mostra o nascondi la password">Mostra</button>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" type="submit">Accedi</button>
  </form>
  <div class="lock">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Accesso riservato al personale InnovaPuglia
  </div>
</main>
<div class="foot">© InnovaPuglia spa</div>
<script>
const $=s=>document.querySelector(s),DOM="@innova.puglia.it";
function errore(t){const e=$("#err");e.textContent=t;e.classList.toggle("on",!!t)}
$("#tg").onclick=()=>{const p=$("#pw"),v=p.type==="password";p.type=v?"text":"password";p.classList.toggle("vis",v);$("#tg").textContent=v?"Nascondi":"Mostra"};
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();errore("");
  let email=$("#email").value.trim().toLowerCase();
  if(email&&!email.includes("@"))email+=DOM;
  if(!/^[a-z0-9._%+\-]+@innova\.puglia\.it$/.test(email))return errore("Inserisci la tua email aziendale (@innova.puglia.it).");
  if(!$("#pw").value)return errore("Inserisci la password.");
  $("#go").disabled=true;$("#go").textContent="Accesso in corso…";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:$("#pw").value})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.errore||"Accesso non riuscito");
    location.replace("/");
  }catch(err){errore(err.message);$("#go").disabled=false;$("#go").textContent="Accedi";$("#pw").select()}
});
</script>
</body>
</html>
